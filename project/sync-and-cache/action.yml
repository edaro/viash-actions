name: Sync and cache test resources specified by the project config
author: Data Intuitive
description: |
  Sync and cache test resources. This action will sync test resources from
  different sources (e.g. s3, gs, LaminDB) and cache them for later use. The cache key is
  based on the hash of the test resources. For this action to work, the Viash
  project config should contain a list of test resources to sync.

  Supported storage types:

    - `s3`: Syncs resources from an S3 bucket.
    - `gs`: Syncs resources from a Google Cloud Storage bucket.
    - `lamin`: Syncs an artifact or the artifacts of a collection from a LaminDB instance.
    - Create a GitHub issue if you need support for other storage types.

  The type is inferred from the path if not specified. After syncing, files under
  `dest` that do not belong to the resource are removed.

  Example:

  ```yaml
  info:
    test_resources:
      - type: s3
        path: s3://my-bucket/my-folder
        dest: my-folder
      - type: gs
        path: gs://my-bucket/my-other-folder
        dest: my-other-folder
      - type: lamin
        path: lamin://my-org/my-instance/collection/abcdEFGH12345678
        dest: resources_test
      - path: lamin://my-org/my-instance/artifact/abcdEFGH123456780000
        dest: resources_test/common/pancreas/dataset.anndata.zarr
  ```

  LaminDB resources:

    - `path` has the form `lamin://<owner>/<instance>/artifact/<uid>` or
      `lamin://<owner>/<instance>/collection/<uid>`. A 20-character uid pins an exact
      version, a 16-character stem uid resolves to the latest version.
    - An artifact (a file or a folder) is downloaded to exactly `dest`.
    - Each artifact of a collection is downloaded to `<dest>/<key>`. Use the optional field
      `strip_prefix` to remove a prefix from the start of each key.
    - The cache key is derived from the uids and hashes of the resolved artifacts and
      collections, so it changes exactly when their content changes.
    - Public instances are read anonymously. For private instances, set the `LAMIN_API_KEY`
      environment variable.
    - Requires [uv](https://docs.astral.sh/uv/), which is installed by this action if needed.
inputs:
  project_directory:
    required: false
    description: Path to the project directory. This is the directory where the project config `_viash.yaml` is located.
  cache_key_prefix:
    required: false
    description: A prefix for the cache hash key. Prefix is also used for restoring stale cache if no cache hit occurred for key.
    default: cachekey__
outputs:
  cache_key:
    description: Caching key to use to restore the cache. If no test resources are detected, this will be an empty string.
    value: ${{ steps.cache_key.outputs.cache_key }}
  dest_paths:
    description: Paths to the synced resources. If no test resources are detected, this will be an empty string.
    value: ${{ steps.test_resources.outputs.dest_paths }}
  cache_hit:
    description: "`'true'` if the cache was restored from an exact match of `cache_key`, `'false'` otherwise."
    value: ${{ steps.cache.outputs.cache-hit == 'true' }}
runs:
  using: 'composite'
  steps:
    - name: Detect test resources
      id: test_resources
      shell: bash
      working-directory: ${{ inputs.project_directory }}
      run: |
        resources_detected=$(yq e '.info | has("test_resources")' "_viash.yaml")
        if [ "$resources_detected" == "false" ]; then
          echo "No test resources detected."
          echo "dest_paths=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # reformat the test resources into a pseudo-json that can be read line-by-line by bash
        # infer the type from the path if not specified
        yq_script="
          .info.test_resources | 
            map_values(.type = .type // (.path | sub(\"://.*\", \"\"))) |
            .[] |
            \"{type: \" + .type + \", path: \" + .path + \", dest: \" + .dest + \"}\"
        "

        test_resources=$(yq e "$yq_script" "_viash.yaml")

        # write the test resources as json, for lamin_sync.py
        work_dir=$(mktemp -d "$RUNNER_TEMP/sync_and_cache.XXXXXX")
        yq -o=json '.info.test_resources | map(.type = .type // (.path | sub("://.*", "")))' "_viash.yaml" \
          > "$work_dir/test_resources.json"
        has_lamin=$(jq 'any(.[]; .type == "lamin")' "$work_dir/test_resources.json")
        echo "work_dir=$work_dir" >> "$GITHUB_OUTPUT"
        echo "has_lamin=$has_lamin" >> "$GITHUB_OUTPUT"

        # fetch the test resource destination paths
        # todo: convert to absolute paths
        dest_paths=$(
          yq e '.info.test_resources[] | .dest' "_viash.yaml" | sed "s#.*#$(pwd)/&#"
        )

        # output multiline string
        cat >> "$GITHUB_OUTPUT" <<HERE
        test_resources<<EOF
        $test_resources
        EOF
        dest_paths<<EOF
        $dest_paths
        EOF
        HERE

    - name: Set up uv
      if: ${{ steps.test_resources.outputs.has_lamin == 'true' }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false

    # create cache_key key
    # this is the combined hash of all of the files across the different test resource sources
    - name: Create hash key
      shell: bash
      id: cache_key
      working-directory: ${{ inputs.project_directory }}
      env:
        TEST_RESOURCES: ${{ steps.test_resources.outputs.test_resources }}
        CACHE_KEY_PREFIX: ${{ inputs.cache_key_prefix }}
        WORK_DIR: ${{ steps.test_resources.outputs.work_dir }}
        HAS_LAMIN: ${{ steps.test_resources.outputs.has_lamin }}
      run: |
        if [ -z "$TEST_RESOURCES" ]; then
          echo "cache_key=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # resolve lamin uids and hashes once, the sync step reuses the manifest
        lamin_manifest="$WORK_DIR/lamin_manifest.json"
        if [ "$HAS_LAMIN" == "true" ]; then
          LAMIN_CACHE_DIR="$WORK_DIR/lamin_cache" \
            uv run --script "$GITHUB_ACTION_PATH/lamin_sync.py" resolve \
            --resources "$WORK_DIR/test_resources.json" \
            --manifest "$lamin_manifest"
        fi

        function s3_ls() {
          local s3_path="$1"
          AWS_EC2_METADATA_DISABLED=true \
            aws s3 ls \
            "$s3_path" \
            --recursive \
            --no-sign-request
        }
        function gs_ls() {
          local gs_path="$1"
          gsutil ls -l "${gs_path%/*}/**"
        }

        ls_content=$(
          index=0
          echo "$TEST_RESOURCES" | \
            while read -r line; do
              type=$(echo "$line" | yq e '.type')
              path=$(echo "$line" | yq e '.path')
              dest=$(echo "$line" | yq e '.dest')

              echo "# type: $type, path: $path, dest: $dest"
              echo ""

              if [ "$type" == "s3" ]; then
                s3_ls "$path"
              elif [ "$type" == "gs" ]; then
                gs_ls "$path"
              elif [ "$type" == "lamin" ]; then
                jq -r --argjson index "$index" \
                  '.resources[] | select(.index == $index) | .key_lines[]' \
                  "$lamin_manifest" || exit 1
              else
                echo "Unsupported storage type: '$type' for bucket '$path'."
                exit 1
              fi

              echo ""
              index=$((index + 1))
            done
        )

        hash=$(echo "${ls_content}" | md5sum | awk '{ print $1 }')

        echo "cache_key=$CACHE_KEY_PREFIX$hash" >> "$GITHUB_OUTPUT"

    - name: Print resources
      shell: bash
      if: ${{ steps.cache_key.outputs.cache_key != '' }}
      working-directory: ${{ inputs.project_directory }}
      env:
        CACHE_KEY: ${{ steps.cache_key.outputs.cache_key }}
        TEST_RESOURCES: ${{ steps.test_resources.outputs.test_resources }}
        DEST_PATHS: ${{ steps.test_resources.outputs.dest_paths }}
      run: |
        echo "### Cache key: $CACHE_KEY"
        echo

        echo "### Contents of 'test_resources':"
        echo
        echo "$TEST_RESOURCES"
        echo

        echo "### Contents of 'dest_paths':"
        echo
        echo "$DEST_PATHS"
        echo

    # initialize cache
    - name: Cache resources
      id: cache
      uses: actions/cache@v6
      if: ${{ steps.cache_key.outputs.cache_key != '' }}
      with:
        path: ${{ steps.test_resources.outputs.dest_paths }}
        key: ${{ steps.cache_key.outputs.cache_key }}
        restore-keys: ${{ inputs.cache_key_prefix }}

    # sync if need be
    - name: Sync resources
      shell: bash
      if: ${{ steps.cache_key.outputs.cache_key != '' }}
      working-directory: ${{ inputs.project_directory }}
      env:
        TEST_RESOURCES: ${{ steps.test_resources.outputs.test_resources }}
        WORK_DIR: ${{ steps.test_resources.outputs.work_dir }}
        HAS_LAMIN: ${{ steps.test_resources.outputs.has_lamin }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        function sync_s3() {
          local s3_path="$1"
          local dest_path="$2"
          AWS_EC2_METADATA_DISABLED=true \
            aws s3 sync \
            "$s3_path" \
            "$dest_path" \
            --no-sign-request \
            --delete
        }
        function sync_gs() {
          local gs_path="$1"
          local dest_path="$2"
          local orig_setting
          orig_setting=$(gcloud config get-value auth/disable_credentials)
          gcloud config set auth/disable_credentials true
          gcloud storage rsync -r "$gs_path" "$dest_path" --delete-unmatched-destination-objects
          gcloud config set auth/disable_credentials "$orig_setting"
        }

        echo "$TEST_RESOURCES" | \
          while read -r line; do
            type=$(echo "$line" | yq e '.type')
            path=$(echo "$line" | yq e '.path')
            dest=$(echo "$line" | yq e '.dest')

            # lamin resources are synced below, after s3 and gs
            if [ "$type" == "lamin" ]; then
              continue
            fi

            echo "Syncing '$path' to '$dest'..."

            if [ "$type" == "s3" ]; then
              sync_s3 "$path" "$dest"
            elif [ "$type" == "gs" ]; then
              sync_gs "$path" "$dest"
            else
              echo "Unsupported storage type: '$type' for bucket '$path'."
              exit 1
            fi
          done

        if [ "$HAS_LAMIN" == "true" ]; then
          lamin_args=()
          if [ "$CACHE_HIT" == "true" ]; then
            lamin_args+=(--cache-hit)
          fi
          # downloads are moved from the lamin cache into the destinations
          LAMIN_CACHE_DIR="$WORK_DIR/lamin_cache" \
            uv run --script "$GITHUB_ACTION_PATH/lamin_sync.py" sync \
            --manifest "$WORK_DIR/lamin_manifest.json" \
            "${lamin_args[@]}"
          rm -rf "$WORK_DIR/lamin_cache"
        fi

    - name: List resources
      shell: bash
      if: ${{ steps.cache_key.outputs.cache_key != '' }}
      working-directory: ${{ inputs.project_directory }}
      env:
        TEST_RESOURCES: ${{ steps.test_resources.outputs.test_resources }}
      run: |
        echo "$TEST_RESOURCES" | \
          while read -r line; do
            type=$(echo "$line" | yq e '.type')
            path=$(echo "$line" | yq e '.path')
            dest=$(echo "$line" | yq e '.dest')

            echo "===================================="
            echo "type: $type"
            echo "path: $path"
            echo "dest: $dest"
            if [ -d "$dest" ]; then
              tree "$dest" -L 3
            else
              ls -l "$dest"
            fi
            echo ""
            echo "===================================="
          done
